<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thalidomide VR Experience (A-Frame)</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script>
</head>
<body>

    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .molecule">
        
        <a-assets>
            <a-asset-item id="thalidomide-obj" src="thalidomide.obj"></a-asset-item>
            <a-asset-item id="thalidomide-mtl" src="thalidomide.mtl"></a-asset-item>
        </a-assets>

        <a-sky color="#f5f5f5"></a-sky> <a-entity light="type: ambient; intensity: 0.7;"></a-entity>
        <a-entity light="type: directional; intensity: 1; castShadow: true;" position="1 3 1"></a-entity>

        <a-entity id="rig" position="0 0 2">
            <a-camera id="camera" look-controls wasd-controls position="0 1.6 0">
                <a-entity cursor="fuse: true; fuseTimeout: 1000"
                          position="0 0 -1"
                          geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                          material="color: black; shader: flat"
                          raycaster="objects: .molecule"
                          animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1"
                          animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 1000; from: 1 1 1; to: 0.1 0.1 0.1"
                          animation__mouseleave="property: scale; startEvents: mouseleave; easing: easeInCubic; dur: 500; to: 1 1 1">
                </a-entity>
            </a-camera>
            <a-entity laser-controls="hand: right" raycaster="objects: .molecule; far: 100"></a-entity>
        </a-entity>

        <a-entity id="r-molecule-container" position="-2 1.5 -2">
            <a-entity class="molecule"
                      obj-model="obj: #thalidomide-obj; mtl: #thalidomide-mtl" 
                      scale="0.2 0.2 0.2"
                      animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear"
                      event-set__mouseenter="scale: 0.22 0.22 0.22"
                      event-set__mouseleave="scale: 0.2 0.2 0.2"
                      onclick="showInfo('R')">
            </a-entity>
            <a-text value="R-Thalidomide" position="0 1 0" align="center" color="#333" width="4"></a-text>
            <a-text value="(Sedative)" position="0 0.7 0" align="center" color="#008000" width="3"></a-text>
        </a-entity>

        <a-entity id="s-molecule-container" position="2 1.5 -2">
            <a-entity class="molecule"
                      obj-model="obj: #thalidomide-obj; mtl: #thalidomide-mtl" 
                      scale="-0.2 0.2 0.2" 
                      animation="property: rotation; to: 0 -360 0; loop: true; dur: 10000; easing: linear"
                      event-set__mouseenter="scale: -0.22 0.22 0.22"
                      event-set__mouseleave="scale: -0.2 0.2 0.2"
                      onclick="showInfo('S')">
            </a-entity>
            <a-text value="S-Thalidomide" position="0 1 0" align="center" color="#333" width="4"></a-text>
            <a-text value="(Teratogenic)" position="0 0.7 0" align="center" color="#FF0000" width="3"></a-text>
        </a-entity>

        <a-plane id="info-panel" position="0 2.5 -1.8" width="3" height="1" color="#333" visible="false" material="opacity: 0.9">
            <a-text id="info-text" value="Welcome. Click a molecule to learn more." align="center" color="white" width="2.8" position="0 0 0.01"></a-text>
            <a-plane id="close-btn" position="1.3 0.35 0.02" width="0.3" height="0.2" color="#FF4444" class="molecule" onclick="hideInfo()">
                <a-text value="X" align="center" color="white" width="2"></a-text>
            </a-plane>
        </a-plane>

    </a-scene>
<script>
        const infoPanel = document.getElementById('info-panel');
        const infoText = document.getElementById('info-text');

        function showInfo(type) {
            infoPanel.setAttribute('visible', 'true');
            if (type === 'R') {
                infoText.setAttribute('value', 'R-Enantiomer: This structure acts as a sedative. It has the intended therapeutic effect and does not cause birth defects directly.');
                infoText.setAttribute('color', '#98FB98'); // أخضر فاتح
            } else if (type === 'S') {
                infoText.setAttribute('value', 'S-Enantiomer: This structure is teratogenic. It fits into a different active site, causing severe birth defects. This is the source of the toxicity.');
                infoText.setAttribute('color', '#FFCCCB'); // أحمر فاتح
            }
        }

        function hideInfo() {
            infoPanel.setAttribute('visible', 'false');
        }
    </script>
</body>
</html>
